name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - run: |
          # 1. 自动生成安卓工程的地基
          flutter create . --platforms android --project-name laoma_tingshu
          
          # 2. 核心补丁：强制开启 App 联网权限（解决不能搜的问题）
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. 整理代码：把你的 main.dart 挪到它该去的地方
          rm -rf lib
          mkdir -p lib
          cp main.dart lib/main.dart || true
          
      - run: flutter pub get
      - run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
