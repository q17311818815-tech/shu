name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create . --platforms android --project-name laoma_tingshu
          # 开启联网权限补丁
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          # 确保代码在 lib 文件夹
          rm -rf lib
          mkdir -p lib
          cp main.dart lib/main.dart || true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
