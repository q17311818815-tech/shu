name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          # 1. 自动生成工程
          flutter create . --platforms android --project-name laoma_tingshu
          
          # 2. 强力开启联网权限（解决搜索不了的核心）
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. 暴力纠错：强制定位 main.dart
          # 不管你在根目录还是在 lib 下，都给老子归位！
          mkdir -p lib
          find . -maxdepth 2 -name "main.dart" -exec cp {} lib/main.dart \;
          
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
