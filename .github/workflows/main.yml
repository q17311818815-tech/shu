name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          # 1. 强制生成安卓地基
          flutter create . --platforms android --project-name laoma_tingshu
          
          # 2. 联网权限开启
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. 终极文件搬运：把你能找到的所有 main.dart 都试一遍，直到填满 lib/main.dart
          mkdir -p lib
          if [ -f "lib/main.dart" ]; then
            echo "代码已在lib目录"
          elif [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
            echo "已从根目录搬运代码"
          fi
          
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
