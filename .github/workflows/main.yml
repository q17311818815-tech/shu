name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          # 1. 强行初始化安卓地基
          flutter create . --platforms android --project-name laoma_tingshu
          
          # 2. 暴力破解联网墙：在安卓配置文件里强行插入上网许可
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 3. 强制归位：不管代码在哪，都给老子塞进 lib/main.dart
          mkdir -p lib
          find . -maxdepth 2 -name "main.dart" -exec cp {} lib/main.dart \;
          
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
