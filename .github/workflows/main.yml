name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: |
          flutter create . --platforms android --project-name laoma_tingshu
          
          # 【补丁A】开启联网权限
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          # 【补丁B】核心修复：允许访问所有 HTTP 网站（解决搜不了的核心问题）
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || sed -i '/<application/a \        android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          
          # 【补丁C】强制归位代码
          mkdir -p lib
          find . -maxdepth 2 -name "main.dart" -exec cp {} lib/main.dart \;
          
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LaoMaApp
          path: build/app/outputs/flutter-apk/app-release.apk
